name: Deploy to GitHub Pages

# 仅在 master（主分支）被推送时触发（不含 tag 触发）。
on:
  push:
    branches:
      - master
  workflow_dispatch: # 也可手动触发

# 允许 GITHUB_TOKEN 写入 Pages 环境 + 授予 Pages 部署权限。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑；新推送会取消旧的进行中部署。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Vite)
        run: npm run build:vite

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4